name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Build demo dataset fixture
        # Upstream HuggingFace datasets-server intermittently returns 500s; retry before failing.
        run: |
          for attempt in 1 2 3; do
            uv run python -m agent_eval.maintenance.main build-demo-dataset && exit 0
            echo "demo dataset build attempt $attempt failed; retrying after backoff"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint:web

      - name: Vitest
        run: pnpm test:web

      - name: Build
        run: pnpm build:web
