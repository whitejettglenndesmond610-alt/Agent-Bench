name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Cache demo dataset fixture
        id: cache-demo
        uses: actions/cache@v4
        with:
          path: data/demo-dataset
          key: demo-dataset-${{ hashFiles('apps/api/src/agent_eval/datasets/demo_builder.py', 'apps/api/src/agent_eval/datasets/schema.py') }}

      - name: Build demo dataset fixture
        # Upstream HuggingFace datasets-server intermittently returns 5xx for minutes at a
        # time; retry on cache miss and reuse the cached fixture when the code is unchanged.
        if: steps.cache-demo.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            uv run python -m agent_eval.maintenance.main build-demo-dataset && exit 0
            echo "demo dataset build attempt $attempt failed; retrying after backoff"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint:web

      - name: Vitest
        run: pnpm test:web

      - name: Build
        run: pnpm build:web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @agent-eval/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm build:web

      - name: Playwright E2E
        # The config boots the disposable stack itself: temporary sqlite
        # database with migrations, API + worker, and the demo fake
        # agent/judge services on loopback ports 8100/9101/9102/4173.
        run: pnpm --filter @agent-eval/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/.e2e/worker.log
          retention-days: 7
