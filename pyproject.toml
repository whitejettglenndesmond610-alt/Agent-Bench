[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluation-platform"
version = "0.1.0"
description = "Internal platform for evaluating and ranking third-party agents"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45.0,<47",
  "fastapi>=0.116,<1",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "jsonpath-ng>=1.7,<2",
  "pydantic-settings>=2.10,<3",
  "regex>=2026.7,<2027",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.35,<1",
  "boto3>=1.39,<2",
  "botocore>=1.39,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
tau2 = [
  "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@v1.0.1",
  "httpx[socks]",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/agent_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
markers = [
  "minio: requires AGENT_EVAL_TEST_S3_ENDPOINT_URL and AGENT_EVAL_TEST_S3_BUCKET",
  "postgresql: requires AGENT_EVAL_TEST_POSTGRES_URL pointing to a disposable database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent_eval"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_eval"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "asyncpg.*", "boto3.*", "botocore.*", "jsonpath_ng.*", "regex.*", "tau2.*", "litellm.*"]
ignore_missing_imports = true
